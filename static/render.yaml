services:
  - type: web
    name: ray-gold-guardian-bot
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LIVE_PRICE_PROVIDER
        value: none
      - key: ENABLE_SIMULATED_FEED
        value: false
      - key: SYMBOL
        value: XAUUSD
      - key: INITIAL_XAUUSD_PRICE
        value: 4540.00
      - key: LIVE_POLL_SECONDS
        value: 5
      - key: TRADINGVIEW_WEBHOOK_SECRET
        generateValue: true
